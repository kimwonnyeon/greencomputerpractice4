<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>피그마로 페이지만들기 연습</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script src="js/main.js" defer></script>
    <!-- Swiper CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  </head>
  <body>
    <!-- 전체 레이아웃 -->
    <div class="container">
      <!-- header -->
      <header>
        <!-- logo -->
        <a href="#"><h1>Daily</h1></a>
        <!-- 네비게이션 -->
        <nav>
          <a href="#">홈</a>
          <a href="#">기능</a>
          <a href="#">소개</a>
          <button>시작하기</button>
          <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </nav>
      </header>
      <!-- hero -->
      <!-- text영역 -->
      <div class="hero">
        <div class="text-area">
          <p class="top">더 간단한 일정 관리</p>
          <h1>오늘도<br />더 나은 하루를 시작해보세요.</h1>
          <p class="hero-text2">
            daily는 당신의 하루를 더 효율적으로<br />
            관리할 수 있도록 도와주는 간단한 서비스입니다.
          </p>
          <button>시작하기</button>
        </div>
        <div class="swiper imageSwiper">
          <div class="swiper-wrapper">
            <!-- 슬라이드 -->
            <div class="swiper-slide">
              <img src="images/hero1.png" alt="" />
            </div>
            <div class="swiper-slide">
              <img src="images/hero2.png" alt="" />
            </div>
            <div class="swiper-slide">
              <img src="images/hero3.png" alt="" />
            </div>
            <div class="swiper-slide">
              <img src="images/hero4.png" alt="" />
            </div>
          </div>
        </div>
      </div>
      <!-- card-list -->
      <div class="card-list">
        <div class="card">
          <!-- 이미지 -->
          <img src="images/calender.png" alt="달력" />
          <!-- card-text -->
          <h3>간단한 일정 관리</h3>
          <p>
            복잡하지 않은 인터페이스로<br />
            쉽게 일정을 추가하고 관리하세요.
          </p>
        </div>
        <div class="card">
          <!-- 이미지 -->
          <img src="images/check.png" alt="체크" />
          <!-- card-text -->
          <h3>할 일 체크</h3>
          <p>
            해야 할 일을 체크하며<br />
            직무를 더 알차게!
          </p>
        </div>
        <div class="card">
          <!-- 이미지 -->
          <img src="images/bell.png" alt="벨" />
          <!-- card-text -->
          <h3>알림 기능</h3>
          <p>
            중요한 일정을 <br />
            잊지 않도록 도와줘요.
          </p>
        </div>
      </div>
      <!-- banner -->
      <div class="banner">
        <div class="left">
          <!-- 이미지 -->
          <img src="images/airplane.png" alt="종이비행기" />
          <!-- content -->
          <div class="content">
            <h3>지금 바로 시작해 보세요.</h3>
            <p>
              복잡할 필요없어요. Daily와 함께<br />
              더 간단한 일상을 경험해보세요.
            </p>
          </div>
        </div>
        <button>시작하기</button>
      </div>
      <!-- footer -->
      <footer>
        <h4>Daily</h4>
        <nav class="footer">
          <a href="#">이용약관</a>
          <a href="#">개인정보처리방침</a>
        </nav>
      </footer>
    </div>
  </body>
</html>
